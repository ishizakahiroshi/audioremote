# Rust CI (house conventions). Windows-only matrix because the target OS is
# Windows 11 (audio APIs are windows-crate / IPolicyConfig; tests won't build
# on Linux/macOS). Cross-OS matrix will be reconsidered if a portable shim is
# introduced.
name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --locked

      - name: Test
        run: cargo test --all-targets --locked

  msrv:
    name: MSRV (Cargo.toml rust-version)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version declared in Cargo.toml. `rust-version` is a public
      # contract: without this job it drifts silently, which is exactly how the
      # declared 1.75 ended up unable to build the locked dependency graph.
      - name: Read declared MSRV
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Check with the declared MSRV
        run: cargo check --all-targets --locked

  npm-launcher:
    name: npm launcher (Node 20)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The npm channel is the primary install path; this covers platform
      # resolution, the missing-package message and exit-code propagation.
      - name: Test launcher
        run: npm test

  cargo-audit:
    name: cargo audit (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo audit
        run: cargo audit
