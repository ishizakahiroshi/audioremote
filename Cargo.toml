[package]
name = "audioremote"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Switch your Windows 11 host's default audio output device from any browser on the LAN"
readme = "README.md"
license = "MIT"
repository = "https://github.com/ishizakahiroshi/audioremote"
homepage = "https://github.com/ishizakahiroshi/audioremote"
keywords = ["windows", "audio", "core-audio", "remote", "endpoint"]
categories = ["command-line-utilities", "multimedia::audio", "os::windows-apis"]
authors = ["Hiroshi Ishizaka (ishizakahiroshi) <ishizakahiroshi.dev@gmail.com>"]
publish = false

[[bin]]
name = "audioremote"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
getrandom = "0.2"
rust-embed = "8"
local-ip-address = "0.6"
ipnet = "2"

[build-dependencies]
cargo_metadata = "0.19"
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
] }
windows-core = "0.58"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
